# CI: run the test suite on every push and pull request (a clean-machine check).
# CD: after tests pass on main, build the echo-agent image and push it to GHCR.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Run the suite on each Python version we support, in parallel.
      matrix:
        python-version: ["3.10", "3.12"]

    # Throwaway Postgres + Redis for the integration tests. GitHub waits for them
    # to be healthy before the steps run, exposed on localhost.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret  (throwaway CI DB)
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project (with dev dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        env:
          # Makes the integration tests run (they skip without these).
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres # pragma: allowlist secret
          REDIS_URL: redis://localhost:6379
        run: pytest -q

  publish-image:
    # CD: only after ALL test jobs pass, and only for pushes to main (not PRs).
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # let GITHUB_TOKEN push to GHCR

    strategy:
      # Build both deployable images in parallel — same steps, different context.
      matrix:
        include:
          - image: echo-agent
            context: services/echo_agent
          - image: agent-orchestrator
            context: .

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # auto-provided, no manual secret

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          # GHCR requires a lowercase name; tag with both latest and the commit SHA.
          tags: |
            ghcr.io/urigorodetzky/${{ matrix.image }}:latest
            ghcr.io/urigorodetzky/${{ matrix.image }}:${{ github.sha }}
