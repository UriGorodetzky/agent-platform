# The whole system in one command: `docker compose up -d --build`.
#
# The orchestrator reaches the echo replicas by SERVICE NAME over the internal
# Docker network (http://echo-1:8000) — no host ports needed for that. Host
# ports are only for us to poke the services from the outside.

services:
  orchestrator:
    build: .                       # root Dockerfile
    image: agent-orchestrator:0.1
    environment:
      # Service discovery: reach the echo replicas by name, not host ports.
      ECHO_AGENT_URLS: "http://echo-1:8000,http://echo-2:8000,http://echo-3:8000"
      DB_PATH: /data/orchestrator.db
    ports:
      - "8080:8000"                # host 8080 -> orchestrator's 8000
    volumes:
      - orchestrator-data:/data    # SQLite DB survives container recreation
    depends_on:
      - echo-1
      - echo-2
      - echo-3

  echo-1:
    build: ./services/echo_agent
    image: echo-agent:0.2
    environment:
      AGENT_ID: echo-1
    ports:
      - "9001:8000"                # host:container (for direct debugging)

  echo-2:
    build: ./services/echo_agent
    image: echo-agent:0.2
    environment:
      AGENT_ID: echo-2
    ports:
      - "9002:8000"

  echo-3:
    build: ./services/echo_agent
    image: echo-agent:0.2
    environment:
      AGENT_ID: echo-3
    ports:
      - "9003:8000"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - orchestrator

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"     # local dev: view without logging in
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  orchestrator-data:               # named volume, managed by Docker
